name: 飞书每日新闻推送

on:
  schedule:
    # 每天北京时间早上 8:00 运行 (UTC 0:00)
    - cron: '0 0 * * *'
  # 支持手动点击按钮触发测试
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 安装依赖库
        run: pip install requests beautifulsoup4

      - name: 执行抓取与推送
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python -c "
          import os, requests
          import json

          def get_toutiao_hot():
              try:
                  # 使用今日头条热榜接口，这个非常稳定
                  url = 'https://is.snssdk.com/api/suggest_words/v1/?business_id=top_referral_widget&from=landing&refer=search&source=landing'
                  res = requests.get(url, timeout=10)
                  data = res.json()
                  
                  # 提取前10条热点新闻
                  hot_list = data.get('data', [])[0].get('words', [])[:10]
                  news_text = ''
                  for idx, item in enumerate(hot_list):
                      word = item.get('word')
                      news_text += f'{idx+1}. {word}\n'
                  
                  return news_text if news_text else '今日暂时没有热点新闻。'
              except Exception as e:
                  return f'获取新闻失败，请稍后再试。错误: {str(e)}'

          def send_to_feishu(webhook_url, content):
              payload = {
                  'msg_type': 'text',
                  'content': {
                      'text': f'📅 今日头条热榜精选\n\n{content}\n关键词：每日'
                  }
              }
              requests.post(webhook_url, json=payload)

          webhook = os.environ.get('FEISHU_WEBHOOK')
          if webhook:
              content = get_toutiao_hot()
              send_to_feishu(webhook, content)
          "
