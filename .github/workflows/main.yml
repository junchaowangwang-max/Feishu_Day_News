name: 飞书每日新闻推送

on:
  schedule:
    # 每天北京时间早上 8:00 运行 (UTC 0:00)
    - cron: '0 0 * * *'
  # 支持手动点击按钮触发测试
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 安装依赖库
        run: pip install requests beautifulsoup4

      - name: 执行抓取与推送
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python -c "
          import os, requests

          def get_zhihu_hot():
              try:
                  # 知乎热榜 API，格式极其标准
                  url = 'https://www.zhihu.com/api/v3/feed/topstory/hot-lists/total'
                  headers = {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                  }
                  res = requests.get(url, headers=headers, timeout=15)
                  res.raise_for_status() # 确保请求成功
                  
                  data = res.json()
                  items = data.get('data', [])[:10]
                  
                  news_text = ''
                  for idx, item in enumerate(items):
                      # 提取标题
                      title = item.get('target', {}).get('title')
                      # 提取链接
                      id = item.get('target', {}).get('id')
                      link = f'https://www.zhihu.com/question/{id}'
                      
                      if title:
                          news_text += f'{idx+1}. {title}\n   链接: {link}\n\n'
                  
                  return news_text if news_text else '暂时没有抓取到热榜内容。'
              except Exception as e:
                  return f'获取热榜失败，错误详情: {str(e)}'

          def send_to_feishu(webhook_url, content):
              # 保持 text 格式以确保飞书机器人 100% 兼容
              payload = {
                  'msg_type': 'text',
                  'content': {
                      'text': f'📅 知乎实时热榜精选\n\n{content}关键词：每日'
                  }
              }
              try:
                  r = requests.post(webhook_url, json=payload, timeout=10)
                  print(f'发送结果: {r.text}')
              except Exception as e:
                  print(f'发送请求失败: {e}')

          webhook = os.environ.get('FEISHU_WEBHOOK')
          if webhook:
              content = get_zhihu_hot()
              send_to_feishu(webhook, content)
          else:
              print('未配置 FEISHU_WEBHOOK')
          "
